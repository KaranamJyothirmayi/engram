[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram"
version = "0.1.0"
description = "Persistent memory for AI agents — graph-backed, vector-searchable, with biologically-inspired memory decay"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.15",
    "networkx>=3.0",
]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "spacy>=3.7",
    "towncrier>=23.0",
]

[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog"
title_format = "## {version} — {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feat"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "test"
name = "Tests"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = "Maintenance"
showcontent = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
