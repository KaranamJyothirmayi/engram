name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1"  # Weekly on Monday

# Least-privilege: Scorecard needs id-token to publish results
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub code scanning
      id-token: write          # publish results to OpenSSF dashboard
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishes score to https://securityscorecards.dev
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 5
